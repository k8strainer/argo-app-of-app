apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: app-of-app-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: gcr.io/cluster-01-271319/docker.io/library/httpd:latest-1
        ports:
        - containerPort: 80
