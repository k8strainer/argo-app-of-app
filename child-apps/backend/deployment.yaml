apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: app-of-app-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsUser: 101   # nginx User
        fsGroup: 101     # nginx Gruppe, um Schreibrechte im Container zu geben
      containers:
      - name: backend
        image: mirror.gcr.io/library/nginx:1.23
        ports:
        - containerPort: 80
        volumeMounts:
        - name: cache-volume
          mountPath: /var/cache/nginx
      volumes:
      - name: cache-volume
        emptyDir: {}

