apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/k8strainer/argo-app-of-apps.git'
    targetRevision: HEAD
    path: child-apps/frontend
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dev-frontend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
